version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "10:00" # (UTC)

    cooldown:
      default-days: 6 # match pnpm minimumReleaseAge
    
    labels:
      - "dependencies"
      - "npm"

    commit-message:
      prefix: "fix"
      prefix-development: "chore"
      include: "scope"

    groups:
      strapi:
        patterns:
          - "@strapi/strapi"
          - "@strapi/typescript-utils"
          - "@strapi/design-system"
          - "@strapi/icons"
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "react-router-dom"
          - "styled-components"
          - "@types/koa"
          - "@types/node"
          - "typescript"
        update-types:
          - "minor"
          - "patch"

      testing:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "vitest-browser-react"
          - "playwright"
        update-types:
          - "minor"
          - "patch"

      linting:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "typescript-eslint"
          - "@stylistic/*"
          - "globals"
        update-types:
          - "minor"
          - "patch"

      internal:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "10:00" # (UTC)

    cooldown:
      default-days: 6
    
    labels:
      - "dependencies"
      - "github-actions"

    commit-message:
      prefix: "chore"
      include: "scope"

    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
